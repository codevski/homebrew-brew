name: Bump casks

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-casks

jobs:
  bump:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        cask: [feishin, fladder, ps5upload]
    env:
      CASK: ${{ matrix.cask }}
      TAP_CASK: codevski/brew/${{ matrix.cask }}
      BRANCH: bump/${{ matrix.cask }}
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v5

      - name: Set up Homebrew with this checkout as the tap
        run: |
          brew update --quiet
          tap="$(brew --repository)/Library/Taps/codevski"
          mkdir -p "$tap"
          ln -sfn "$GITHUB_WORKSPACE" "$tap/homebrew-brew"

      - name: Check for a new version
        id: check
        run: |
          info=$(brew livecheck --cask --json "$TAP_CASK")
          current=$(jq -r '.[0].version.current' <<<"$info")
          latest=$(jq -r '.[0].version.latest' <<<"$info")
          echo "current=$current latest=$latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          if [ "$(jq -r '.[0].version.outdated' <<<"$info")" != "true" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if the open bump PR already carries this version.
          if git fetch --quiet origin "$BRANCH" 2>/dev/null &&
             git show "FETCH_HEAD:Casks/$CASK/$CASK.rb" | grep -q "version \"$latest\""; then
            echo "Bump branch already at $latest"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "bump=true" >> "$GITHUB_OUTPUT"

      - name: Update version and checksums
        if: steps.check.outputs.bump == 'true'
        run: |
          git switch -C "$BRANCH"
          brew bump-cask-pr --write-only --no-audit --no-browse \
            --version "${{ steps.check.outputs.latest }}" "$TAP_CASK"

      - name: Audit
        if: steps.check.outputs.bump == 'true'
        run: |
          brew style "$TAP_CASK"
          brew audit --cask --strict --online "$TAP_CASK"
          brew audit --cask --strict --online --arch=intel "$TAP_CASK"

      - name: Test install
        if: steps.check.outputs.bump == 'true'
        run: |
          brew install --cask "$TAP_CASK"
          brew uninstall --cask --zap "$TAP_CASK"

      - name: Open or update pull request
        if: steps.check.outputs.bump == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          git config user.name "codevski"
          git config user.email "1435321+codevski@users.noreply.github.com"
          git commit -am "Bump $CASK to $LATEST"
          git push --force origin "$BRANCH"

          title="Bump $CASK to $LATEST"
          body="Automated bump of \`$CASK\` to $LATEST.

          Checked in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID):
          - \`brew style\`
          - \`brew audit --cask --strict --online\` (arm and intel)
          - \`brew install --cask\` / \`brew uninstall --cask --zap\` (arm)

          Test locally:
          \`\`\`
          cd \"\$(brew --repository codevski/brew)\" && gh pr checkout $BRANCH
          brew reinstall --cask $CASK
          git checkout main
          \`\`\`"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
          fi
