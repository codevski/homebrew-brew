name: Test casks

# Runs on branches you push yourself. Bot bump branches are skipped because
# bump.yml already runs these checks before opening their PRs.
on:
  push:
    branches-ignore:
      - main
      - "bump/**"
    paths:
      - "Casks/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Homebrew with this checkout as the tap
        run: |
          brew update --quiet
          tap_dir="$(brew --repository)/Library/Taps/$GITHUB_REPOSITORY"
          mkdir -p "$(dirname "$tap_dir")"
          ln -sfn "$GITHUB_WORKSPACE" "$tap_dir"
          echo "TAP=${GITHUB_REPOSITORY%%/*}/${GITHUB_REPOSITORY#*/homebrew-}" >> "$GITHUB_ENV"

      - name: Style, audit and install changed casks
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base=$(git merge-base origin/main HEAD)
            files=$(git diff --name-only --diff-filter=AM "$base" HEAD -- 'Casks/**/*.rb')
          else
            files=$(git ls-files 'Casks/**/*.rb')
          fi
          [ -n "$files" ] || { echo "No casks changed"; exit 0; }

          for f in $files; do
            cask="$TAP/$(basename "$f" .rb)"
            echo "::group::$cask"
            brew style "$cask"
            brew audit --cask --strict --online "$cask"
            brew audit --cask --strict --online --arch=intel "$cask"
            brew install --cask "$cask"
            brew uninstall --cask --zap "$cask"
            echo "::endgroup::"
          done
